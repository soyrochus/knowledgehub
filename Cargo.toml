[package]
name = "knowledgehub"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Governed, source-bound system definitions with atomic file snapshots"
license = "MIT"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tokio = { version = "=1.53.1", features = ["rt", "sync"] }
libc = "=0.2.191"

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "time"] }
